[project]
name = "astrometry-lite"
version = "0.1.0"
description = "FastAPI + React rewrite of astrometry.net service"
readme = "README.md"
authors = [{ name = "Astrometry Lite" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.3",
    "motor>=3.5.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.17",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "rich>=13.9.2",
    "pillow>=11.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.5"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
