name: astrometry-dev

# 开发环境配置
# 使用: docker-compose up -d
# 特点: 代码挂载、热重载、开发服务器

services:
  mongodb:
    image: mongo:8
    container_name: astrometry-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    environment:
      - MONGO_INITDB_DATABASE=astrometry_dev
    networks:
      - astrometry-network
    restart: unless-stopped

  backend:
    image: astrometry-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrometry-backend
    ports:
      - "8020:8000"
    volumes:
      - ./data:/app/data
      - ./astrometry_indexes:/app/astrometry_indexes
      - ./catalogs:/app/catalogs
      # 挂载代码目录以实现热重载（开发模式）
      - ./api:/app/api
      - ./core:/app/core
      - ./domain:/app/domain
      - ./services:/app/services
      - ./workers:/app/workers
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DBNAME=astrometry_dev
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      - mongodb
    networks:
      - astrometry-network
    restart: unless-stopped
    # 使用 --reload 启用自动重载
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: astrometry-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astrometry-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8020
    depends_on:
      - backend
    networks:
      - astrometry-network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

networks:
  astrometry-network:
    driver: bridge

