name: astrometry-dev

# 开发环境配置
# 使用: docker-compose up -d
# 特点: 代码挂载、热重载、开发服务器

services:
  mongodb:
    image: mongo:8
    container_name: astrometry-mongodb
    # MongoDB port not exposed externally for security
    # Access MongoDB from within Docker network using: mongodb:27017
    # To run TUI: ./scripts/run_tui_in_docker.sh
    volumes:
      - ./data/mongodb:/data/db
    environment:
      - MONGO_INITDB_DATABASE=astrometry_dev
    networks:
      - astrometry-network
    restart: unless-stopped

  backend:
    image: astrometry-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrometry-backend
    ports:
      - "${API_PORT:-8002}:8002"
    volumes:
      - ./data:/app/data
      - ./astrometry_indexes:/app/astrometry_indexes
      - ./catalogs:/app/catalogs
      # 挂载代码目录以实现热重载（开发模式）
      - ./api:/app/api
      - ./core:/app/core
      - ./domain:/app/domain
      - ./services:/app/services
      - ./workers:/app/workers
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DBNAME=astrometry_dev
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-8002}
    depends_on:
      - mongodb
    networks:
      - astrometry-network
    restart: unless-stopped
    # 使用 --reload 启用自动重载
    command: sh -c "uvicorn api.main:app --host 0.0.0.0 --port $${API_PORT:-8002} --reload"

  frontend:
    image: astrometry-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astrometry-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:${API_PORT:-8002}/api
      - VITE_FRONTEND_PORT=${FRONTEND_PORT:-5173}
      - DOCKER_ENV=true
    depends_on:
      - backend
    networks:
      - astrometry-network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

  worker:
    image: astrometry-backend:latest
    container_name: astrometry-worker
    volumes:
      - ./data:/app/data
      - ./astrometry_indexes:/app/astrometry_indexes
      - ./catalogs:/app/catalogs
      # 挂载代码目录以实现热重载（开发模式）
      - ./api:/app/api
      - ./core:/app/core
      - ./domain:/app/domain
      - ./services:/app/services
      - ./workers:/app/workers
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DBNAME=astrometry_dev
    depends_on:
      - mongodb
      - backend
    networks:
      - astrometry-network
    restart: unless-stopped
    command: python -m workers.run_worker

networks:
  astrometry-network:
    driver: bridge

