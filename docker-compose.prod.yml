name: astrometry-prod

services:
  mongodb:
    image: mongo:8
    container_name: astrometry-mongodb-prod
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    environment:
      - MONGO_INITDB_DATABASE=astrometry_dev
    networks:
      - astrometry-network
    restart: unless-stopped

  backend:
    image: astrometry-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrometry-backend-prod
    ports:
      - "8020:8002"
    volumes:
      # 生产环境只挂载数据目录，不挂载代码
      - ./data:/app/data
      - ./astrometry_indexes:/app/astrometry_indexes
      - ./catalogs:/app/catalogs
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DBNAME=astrometry_dev
      - API_HOST=0.0.0.0
      - API_PORT=8002
    depends_on:
      - mongodb
    networks:
      - astrometry-network
    restart: unless-stopped
    # 生产环境不使用 --reload
    # command 使用 Dockerfile 中的默认 CMD

  frontend:
    image: astrometry-frontend-prod:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # 设置前端 API 基础 URL（根据实际部署环境修改）
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8020}
    container_name: astrometry-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - astrometry-network
    restart: unless-stopped

networks:
  astrometry-network:
    driver: bridge

