name: astrometry-prod

services:
  mongodb:
    image: mongo:8
    container_name: astrometry-mongodb-prod
    # MongoDB port not exposed externally for security
    # Access MongoDB from within Docker network using: mongodb:27017
    # To run TUI: ./scripts/run_tui_in_docker.sh
    volumes:
      - ./data/mongodb:/data/db
    environment:
      - MONGO_INITDB_DATABASE=astrometry_dev
    networks:
      - astrometry-network
    restart: unless-stopped

  backend:
    image: astrometry-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Frontend will use relative path /api to call backend API
        VITE_API_BASE: /api
    container_name: astrometry-backend-prod
    ports:
      - "8002:8002"
    volumes:
      # 生产环境只挂载数据目录，不挂载代码
      - ./data:/app/data
      - ./astrometry_indexes:/app/astrometry_indexes
      - ./catalogs:/app/catalogs
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DBNAME=astrometry_dev
      - API_HOST=0.0.0.0
      - API_PORT=8002
    depends_on:
      - mongodb
    networks:
      - astrometry-network
    restart: unless-stopped
    # 生产环境不使用 --reload
    # command 使用 Dockerfile 中的默认 CMD
    # 后端会自动serve前端静态文件（通过 api/main.py 配置）

  worker:
    image: astrometry-backend:latest
    container_name: astrometry-worker-prod
    volumes:
      - ./data:/app/data
      - ./astrometry_indexes:/app/astrometry_indexes
      - ./catalogs:/app/catalogs
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DBNAME=astrometry_dev
      - SOLVE_FIELD_BIN=/usr/bin/solve-field
      - ASTROMETRY_ENGINE_BIN=/usr/bin/astrometry-engine
    depends_on:
      - mongodb
      - backend
    networks:
      - astrometry-network
    restart: unless-stopped
    command: python -m workers.run_worker

networks:
  astrometry-network:
    driver: bridge

